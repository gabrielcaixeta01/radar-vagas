name: radar

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Secrets (Settings -> Secrets and variables -> Actions):
      #   SMTP_USER, SMTP_PASSWORD  obrigatorios para o e-mail (senha de app do Gmail)
      #   EMAIL_TO                  opcional; padrao = SMTP_USER
      #   ANTHROPIC_API_KEY         opcional; sem ele o ranking e por palavras do CV
      # Se o e-mail falhar o job fica vermelho (o GitHub te avisa) e o estado
      # nao e salvo, entao as mesmas vagas voltam na proxima execucao.
      - name: Rodar radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m radar --destino arquivo,email

      - name: Commitar relatorio e estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add relatorios/ state/
          if git diff --cached --quiet; then
            echo "nada novo para commitar"
          else
            git commit -m "chore: relatorio $(date -u +%Y-%m-%d)"
            git push
          fi
