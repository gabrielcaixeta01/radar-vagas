# Especificacao do radar. Editar isto e o que ajusta o agente — o codigo nao muda.
#
# Perfil: Engenharia de Computacao / UnB, 7o semestre (ago-2026).
# Interesse: SOFTWARE (tecnologia) e MERCADO FINANCEIRO. Hardware fora.
# Prioridade dentro de software: dados/ML e quant/financeiro.
# Geografia: mora em Brasilia e NAO vai para SP presencial.

escolaridade: [medio, superior]   # 7o semestre: nivel medio ja; superior com posse pos-formatura

estagio:
  # Trilhas prioritarias, em ordem. Entra no prompt do ranking.
  prioridades:
    - dados / machine learning
    - quantitativo / mercado financeiro
    - backend / engenharia de software
    - frontend / full stack

  # Tambem aceita vaga de entrada CLT, nao so estagio.
  niveis: [estagio, trainee, junior]

  # Empresas alvo. O ranking da bonus para essas.
  empresas_alvo:
    # tecnologia
    - iFood
    - Amazon
    - Google
    - Microsoft
    - Meta
    - Mercado Livre
    - Nubank
    - Serpro
    - Dataprev
    - Dell
    - Huawei
    # financas / mercado
    - BTG Pactual
    - XP Inc
    - Itau
    - Itau BBA
    - Bradesco
    - Banco do Brasil
    - Caixa
    - BRB
    - B3
    - Stone
    - PagBank
    - C6 Bank
    - Banco Inter
    - Warren
    - Genial Investimentos
    - Safra
    - Banco Central do Brasil

  # Termos usados na busca das fontes.
  termos_busca:
    - estagio engenharia de software
    - estagio desenvolvimento de software
    - estagio backend
    - estagio front-end
    - estagio full stack
    - estagio ciencia de dados
    - estagio engenharia de dados
    - estagio machine learning
    - estagio QA automacao
    - estagio cloud devops
    - estagio tecnologia banco
    - estagio mercado financeiro tecnologia
    - estagio analise quantitativa
    - programa de estagio ti
    - trainee tecnologia
    - trainee dados
    - desenvolvedor junior
    - analista de dados junior
    - programa trainee banco

  # Buscas em ingles: pegam vagas de multinacional e remotas globais que
  # aparecem listadas para o Brasil. O Indeed nao aceita busca "worldwide"
  # (validado 28/08/2026: devolve 0 linhas), entao esse e o alcance possivel.
  termos_busca_ingles:
    - software engineer intern
    - data science intern
    - data engineer intern
    - quantitative analyst intern
    - junior software engineer remote

  # Filtro de palavras-chave (estagio 1, barato). Basta uma para passar.
  keywords_positivas:
    [python, javascript, typescript, react, next, node, java, kotlin, "c#",
     "c++", go, rust, sql, backend, frontend, "full stack", fullstack, api,
     rest, microsservico, git, docker, kubernetes, cloud, aws, azure, gcp,
     devops, qa, teste automatizado, automacao, dados, data, analytics,
     machine learning, "aprendizado de maquina", ciencia de dados, etl,
     software, desenvolvimento, engenharia de software, ti,
     # trilha financas
     fintech, banco, financeiro, investimentos, mercado de capitais,
     quantitativo, quant, risco, credito, trading, pagamentos, open finance]

  # Rejeita imediatamente. Inclui a trilha de hardware, que esta fora.
  keywords_negativas:
    [vendas, comercial, telemarketing, "suporte n1", "suporte tecnico",
     "help desk", helpdesk, recepcao, administrativo, juridico, contabil,
     marketing, recursos humanos, "nao remunerado",
     "atendimento ao cliente", "customer support", "customer success", "customer onboarding", "application support", "applications support", "product design", "ux design", "ui design",
     # hardware / eletrica — fora do escopo
     hardware, eletronica, "engenharia eletrica", eletrotecnica, firmware,
     "sistemas embarcados", pcb, fpga, vhdl, cabeamento,
     "manutencao de computadores", "tecnico em informatica",
     "automacao industrial", clp, mecatronica, "engenharia mecanica",
     "engenharia civil"]

  # Checado SO no titulo da vaga (na descricao "senior" aparece por acidente,
  # ex.: "reporta ao desenvolvedor senior"). Corta vaga que nao e de entrada.
  titulos_negativos:
  # Casa por palavra inteira ("pl" nao corta "planejamento").
    [senior, "sênior", sr, pleno, pl, especialista, "tech lead", lead,
     coordenador, gerente, manager, supervisor, "head of", principal, staff,
     arquiteto, ii, iii, iv, mid, "mid-level", intermediate]

  formatura_prevista: "2028-07"
  peso_efetivacao: alto        # sinais: "efetivacao", "programa de estagio", duracao >= 12 meses

  local:
    prioridade: [DF, Brasilia, Distrito Federal]
    aceitar_fora_do_df_apenas_se_remoto: true

# Vagas direto do ATS das empresas (API publica do Greenhouse, sem token).
# Validado em 04/11/2026. Para testar um board novo:
#   curl -s https://boards-api.greenhouse.io/v1/boards/NOME/jobs | head -c 300
greenhouse:
  boards:
    - {board: btgpactual, empresa: BTG Pactual}
    - {board: xpinc, empresa: XP Inc}
    - {board: inter, empresa: Banco Inter}
    - {board: c6bank, empresa: C6 Bank}
    - {board: stone, empresa: Stone}
    - {board: ebanx, empresa: EBANX}
    - {board: quintoandar, empresa: QuintoAndar}
    - {board: vtex, empresa: VTEX}
    - {board: nubank, empresa: Nubank}   # board existe mas estava vazio em 04/11
  # O board traz todos os niveis (BTG tem ~250 vagas). Diferente do Indeed,
  # aqui nao ha termo de busca, entao exige sinal de entrada NO TITULO.
  titulos_entrada:
    [estagio, estagiario, estagiaria, intern, internship, trainee, junior, jr,
     "entry level", graduate, assistente, "short job", "banco de talentos"]

concursos:
  # Orgaos com carreira de TI ou de financas. Sao esses que o filtro exige.
  orgaos:
    # bancos publicos / financeiro
    - Banco Central do Brasil
    - Banco do Brasil
    - Caixa Economica Federal
    - BRB
    - BNDES
    - CVM
    - Susep
    - Receita Federal
    # TI federal
    - Serpro
    - Dataprev
    - Ministerio da Gestao
    - Ministerio da Fazenda
    # controle e legislativo (carreiras de TI bem pagas, DF)
    - Tribunal de Contas da Uniao
    - TCU
    - Controladoria-Geral da Uniao
    - CGU
    - Camara dos Deputados
    - Senado Federal
    - Camara Legislativa do Distrito Federal
    - Tribunal de Justica do Distrito Federal
    - TJDFT
    - Superior Tribunal de Justica
    - Tribunal Superior Eleitoral
    # DF
    - Metro-DF
    - Codeplan
    - Correios

  termos_busca:
    - edital abertura concurso publico analista de tecnologia da informacao
    - edital abertura concurso publico tecnico bancario
    - edital abertura concurso publico escriturario
    - edital de abertura analista de sistemas
    - edital abertura concurso publico ciencia de dados

  keywords_negativas:
    [militar, policia militar, bombeiro, medico, enfermeiro, odontologo,
     professor, magisterio, docente, juiz, promotor, defensor,
     engenharia civil, agronomo, veterinario]

  salario_minimo: 4500
  alerta_prazo_dias: 7         # avisa quando a inscricao fecha em <= N dias

ranking:
  usar_llm: false
  modelo: claude-haiku-4-5
  nota_minima: 6               # abaixo disso nao entra no relatorio
  max_itens_por_secao: 25
